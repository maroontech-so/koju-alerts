<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KOJO ALERT — Live Status</title>
<style>
  :root {
    --bg: #0b0f14; --card: #121820; --border: #1e2732;
    --fg: #e6edf3; --muted: #8b949e;
    --green: #3fb950; --red: #f85149; --amber: #d29922; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px; max-width: 900px; margin: 0 auto;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: 0.5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green);
         box-shadow: 0 0 8px var(--green); }
  .dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .sub { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .card .value.green { color: var(--green); }
  .card .value.red { color: var(--red); }
  .card .value.amber { color: var(--amber); }
  h2 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 24px 0 12px; }
  .alert {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .alert .head { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
  .alert .dir-buy { color: var(--green); }
  .alert .dir-sell { color: var(--red); }
  .alert .dir-update { color: var(--amber); }
  .alert .row { color: var(--muted); font-size: 13px; font-family: ui-monospace, monospace; }
  .alert .row b { color: var(--fg); font-weight: 600; }
  .alert a { color: var(--accent); text-decoration: none; font-size: 13px; }
  .alert a:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-size: 14px; padding: 16px 0; }
  footer { color: var(--muted); font-size: 12px; margin-top: 32px; padding-top: 16px;
           border-top: 1px solid var(--border); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  a.cta { display: inline-block; background: var(--accent); color: #000;
          padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<header>
  <span class="dot" id="status-dot"></span>
  <div>
    <h1>KOJO ALERT</h1>
    <div class="sub">Real-time trade alerts from @kojoforextrades</div>
  </div>
</header>

<section class="grid">
  <div class="card"><div class="label">Active subscribers</div><div class="value green" id="subs">—</div></div>
  <div class="card"><div class="label">Signals parsed</div><div class="value" id="done">—</div></div>
  <div class="card"><div class="label">Pending</div><div class="value" id="pending">—</div></div>
  <div class="card"><div class="label">Failed</div><div class="value amber" id="failed">—</div></div>
</section>

<h2>Latest alerts</h2>
<div id="alerts"><div class="empty">Loading…</div></div>

<footer>
  <span id="updated">—</span>
  <a class="cta" id="tg-link" href="https://t.me/kojoforextrades" target="_blank" rel="noopener">Open on Telegram</a>
</footer>

<script>
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

async function refresh() {
  try {
    const [statsRes, alertsRes] = await Promise.all([
      fetch("/api/stats", { cache: "no-store" }),
      fetch("/api/alerts?limit=5", { cache: "no-store" }),
    ]);
    if (!statsRes.ok || !alertsRes.ok) throw new Error("non-ok");
    const stats = await statsRes.json();
    const alerts = await alertsRes.json();

    $("status-dot").classList.remove("offline");
    $("subs").textContent = stats.active_subscribers;
    $("done").textContent = stats.source_messages.done;
    $("pending").textContent = stats.source_messages.pending;
    $("failed").textContent = stats.source_messages.failed;
    $("updated").textContent = "Updated " + new Date(stats.server_time_utc).toLocaleTimeString();

    const wrap = $("alerts");
    if (!alerts.length) {
      wrap.innerHTML = '<div class="empty">No validated strategies yet — the next one will appear here.</div>';
      return;
    }
    wrap.innerHTML = alerts.map(a => {
      if (a.kind === "correction") {
        return `
          <div class="alert">
            <div class="head dir-update">⚠️ Source post updated</div>
            <div class="row">The original post was edited and no longer contains a valid setup.</div>
            <a href="${esc(a.source_url)}" target="_blank" rel="noopener">View post →</a>
          </div>`;
      }
      const cls = a.direction === "SELL" ? "dir-sell" : "dir-buy";
      const tps = (a.take_profit || []).join(" · ");
      return `
        <div class="alert">
          <div class="head ${cls}">${a.direction} ${esc(a.instrument)}</div>
          <div class="row"><b>Entry</b> ${esc(a.entry)} &nbsp; <b>SL</b> ${esc(a.stop_loss)}</div>
          <div class="row"><b>TP</b> ${esc(tps)}</div>
          <div class="row">${esc(a.order_type)} order · confidence ${Math.round((a.confidence||0)*100)}%</div>
          <a href="${esc(a.source_url)}" target="_blank" rel="noopener">View original post →</a>
        </div>`;
    }).join("");
  } catch (e) {
    $("status-dot").classList.add("offline");
    $("updated").textContent = "Reconnecting…";
  }
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
